#      roles: USER
mybatis:
  #mapper的映射路径
  mapper-locations: classpath:mapper/*.xml
  #开启驼峰命名法
  configuration:
   map-underscore-to-camel-case: true
   log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #打印sql到控制台
  logging:
    level: debug #设置Mybatis的日志级别为DEBUG
  mybatis-plus:
    mapper-locations: classpath:mapper/*.xml
    #  配置sql日志
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      map-underscore-to-camel-case: true
logging:
  level:
    root: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    # 或直接启用所有Spring Web日志
    org.springframework.web: DEBUG
    com.example.demo: DEBUG

r:
  bin:
    path: ${R_BIN_PATH:/usr/bin}
  scripts:
    # 相对路径按进程工作目录解析；deploy/start.sh 会以项目根目录为工作目录启动，
    # 并显式注入绝对路径的 R_SCRIPTS_PATH 覆盖此默认值
    path: ${R_SCRIPTS_PATH:src/main/resources/r_scripts}
  lib:
    path: ${R_LIB_PATH:/usr/local/lib/R/site-library}
  temp:
    dir: ${R_TEMP_DIR:tmp}
  eggnog:
    emfile:
      path: ${R_EGGNOG_EMFILE:src/main/resources/data/eggnog/query_seqs.fa.emmaper.annotations}
