server:
  port: 3002
  address: 0.0.0.0
  servlet:
    multipart:
      max-file-size: 100MB # 文件上传大小限制，设置最大值，不能超过该值，否则报错
      max-request-size: 1000MB # 文件最大请求限制，用于批量上传

text: Hello
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息由环境变量注入；默认值面向 standalone Linux 部署（MySQL 与后端同机）
    url: ${CRAB_DB_URL:jdbc:mysql://localhost:3306/crab_database?allowPublicKeyRetrieval=true&useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${CRAB_DB_USER:root}
    password: ${CRAB_DB_PASSWORD:bgs2281037}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  mvc:
    path match:
      matching-strategy: ant_path_matcher
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: MyScheduler
      org.quartz.threadPool.threadCount: 5
      org.quartz.jobStore.class: org.quartz.simpl.RAMJobStore
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
#  security:
